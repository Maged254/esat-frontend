<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Forward the old domain to the new one (keeps the path/query/hash so deep links
      // and old email links still land in the right place). Runs before React loads.
      (function () {
        if (location.hostname === 'esat.egypro.app') {
          location.replace('https://onehub.egypro.app' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#042C53" />
    <link rel="icon" type="image/jpeg" href="/onehub-favicon.jpg" />
    <link rel="apple-touch-icon" href="/onehub-favicon.jpg" />
    <title>OneHub</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <!-- Leaflet: the Route Patrol maps (OneHub Operations). Pinned, and loaded
         as a plain script so it adds no build dependency. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <!-- Groups pins that overlap into one numbered circle, so none hides behind another. -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run OneHub.</noscript>
    <div id="root"></div>
  </body>
</html>
